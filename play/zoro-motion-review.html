<!doctype html><html lang="en"><meta charset="utf-8"><title>Zoro animation review</title><style>body{background:#101b29;color:#e9e1c9;font:15px system-ui;margin:28px}canvas{background:#213448;image-rendering:pixelated;max-width:100%}a{color:#c8edbe}button,input{margin:8px}label{display:inline-block}button{padding:8px}</style><h1>Zoro · Movement & sword techniques</h1><p>Eight full-body stride drawings. Original special poses with windup, cutting trails and recovery.</p><canvas width="1200" height="370"></canvas><p><button id="pause">Pause animation</button><label>Speed <input id="speed" type="range" min="0.2" max="1.5" value="1" step="0.1"></label><button id="flip">Face left</button><label>Inspect sequence <input id="seek" type="range" min="0" max="2.2" step="0.01" value="0"></label></p><p><a href="./?build=zoro-stride3">Play build →</a></p><script src="zoro-art.js?v=zoro-stride3"></script><script src="motion.js"></script><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let im,t=0,last=0,paused=false,facing=1;const players=Array.from({length:4},()=>({x:0,y:0,vx:0,vy:0,grounded:true,facing:1,motion:{phase:0}}));
Promise.all(['zoro-atlas.png','oni-giri.png','zoro-stride.png'].map(name=>new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src='../assets/characters/zoro/'+name+'?v=zoro-stride3';}))).then(a=>{im=ZoroArt.prepare(...a);requestAnimationFrame(draw)});
function draw(now){let dt=Math.min(.04,(now-(last||now))/1000)*+document.querySelector('#speed').value;last=now;if(!paused)t+=dt;else dt=0;const phase=t%2.2;ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;
['Idle','Full-body run','Oni Giri','Tiger Trap'].forEach((name,i)=>{ctx.fillStyle='#e9e1c9';ctx.font='17px system-ui';ctx.fillText(name,i*300+25,35);ctx.fillStyle='#698578';ctx.fillRect(i*300+10,310,280,1);const p=players[i];p.facing=facing;p.vx=i===1?205:0;LuffyMotion.update(p,dt);if(i===1)p.motion.phase=t*205/110;p.special=i===2&&phase<.72?{kind:'onigiri',t:phase,dx:facing,dy:0}:i===3&&phase<1.1?{kind:'tigertrap',t:phase,dx:facing,dy:0}:null;
if(i===2&&phase>=.18&&phase<.52)p.x+=facing*780*dt;ZoroArt.update(p,dt);ctx.save();ctx.translate(i*300+150,310);ctx.scale(2,2);ZoroArt.draw(ctx,im,p,0,0,t);ctx.restore();});document.querySelector('#seek').value=phase;requestAnimationFrame(draw);}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume animation':'Pause animation';};document.querySelector('#flip').onclick=e=>{facing*=-1;e.target.textContent=facing===1?'Face left':'Face right';};document.querySelector('#seek').oninput=e=>{t=+e.target.value;paused=true;document.querySelector('#pause').textContent='Resume animation';};
</script></html>
